<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" style="max-width:100%;height:auto" font-family="Maven Pro, Avenir, Helvetica, Arial, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="10" y="42" width="150" height="54" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/><text x="85" y="66" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">Model output</text><text x="85" y="84" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">the thing we care about</text><line x1="166" y1="69" x2="208" y2="69" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="214" y="42" width="150" height="54" rx="4" fill="#dce6ef" stroke="#2E4A62" stroke-width="1.5"/><text x="289" y="66" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">Judge model</text><text x="289" y="84" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">scores the output</text><line x1="370" y1="69" x2="412" y2="69" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="418" y="42" width="120" height="54" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/><text x="478" y="74" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">one number</text><text x="10" y="20" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">What we report</text><text x="10" y="140" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">What the number actually contains</text><rect x="10" y="152" width="316" height="34" fill="#2E4A62" rx="3"/><rect x="326" y="152" width="212" height="34" fill="#d1d5db" rx="3"/><text x="168" y="174" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="600">evaluator mismatch</text><text x="432" y="174" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">genuine model behavior</text><text x="10" y="208" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">My work separates these two. In the settings I have studied, the first share is</text><text x="10" y="226" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">large enough to change what the evaluation concludes.</text>
</svg>