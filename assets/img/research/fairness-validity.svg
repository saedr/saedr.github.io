<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="560" height="318" style="max-width:100%;height:auto" font-family="Maven Pro, Avenir, Helvetica, Arial, sans-serif" role="img">
<text x="10" y="20" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">A fairness claim needs all three to line up</text><polygon points="280,92 190,200 370,200" fill="none" stroke="#d1d5db" stroke-width="1.5"/><circle cx="280" cy="84" r="7" fill="#2E4A62"/><circle cx="190" cy="208" r="7" fill="#2E4A62"/><circle cx="370" cy="208" r="7" fill="#2E4A62"/><text x="280" y="56" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">Validity claim</text><text x="280" y="72" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">does the score mean what we claim</text><text x="150" y="236" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">Risk account</text><text x="150" y="252" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">which error is costly, and to whom</text><text x="415" y="236" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">Detection contrast</text><text x="415" y="252" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">compared against what baseline</text><text x="280" y="158" font-size="12" fill="#2E4A62" text-anchor="middle" font-weight="600">alignment</text><text x="10" y="286" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Group-wise metric tables without these are hard to interpret: there is no stated</text><text x="10" y="304" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">account of what would have counted as a problem.</text>
</svg>