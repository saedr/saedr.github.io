<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 294" width="560" height="294" style="max-width:100%;height:auto" font-family="Maven Pro, Avenir, Helvetica, Arial, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="10" y="20" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">Generating new items by breaking the old ones</text><rect x="14" y="42" width="150" height="56" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/><text x="89" y="66" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">Source vignette</text><text x="89" y="84" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">diagnosis X</text><line x1="170" y1="70" x2="204" y2="70" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="210" y="42" width="160" height="56" rx="4" fill="#dce6ef" stroke="#2E4A62" stroke-width="1.5"/><text x="290" y="63" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">Counterfactual step</text><text x="290" y="80" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">what if these findings</text><text x="290" y="92" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">were recorded wrong?</text><line x1="376" y1="70" x2="410" y2="70" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="416" y="42" width="130" height="56" rx="4" fill="none" stroke="#2E4A62" stroke-width="1.5"/><text x="481" y="66" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">New chart item</text><text x="481" y="84" font-size="11" fill="#2E4A62" text-anchor="middle" font-weight="400">diagnosis Y</text><rect x="210" y="124" width="160" height="40" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/><text x="290" y="142" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">Self-generated</text><text x="290" y="157" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">knowledge base on X and Y</text><line x1="290" y1="120" x2="290" y2="102" stroke="#2E4A62" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="380" y="148" font-size="10.5" fill="#2E4A62" text-anchor="start" font-weight="400">grounds the new item</text><text x="14" y="200" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">Two physicians rated 100 generated items</text><rect x="14" y="212" width="272" height="30" fill="#2E4A62" rx="3"/><rect x="286" y="212" width="260" height="30" fill="#d1d5db" rx="3"/><text x="150" y="231" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">a useful starting point</text><text x="416" y="231" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">not worth keeping</text><text x="14" y="262" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">About half the drafts were judged useful starting points. The two experts</text><text x="14" y="280" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">often disagreed on which ones — the same rater problem as everywhere else.</text>
</svg>