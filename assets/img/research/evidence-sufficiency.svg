<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" width="560" height="236" style="max-width:100%;height:auto" font-family="Maven Pro, Avenir, Helvetica, Arial, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="10" y="20" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">The same span, read two ways</text><rect x="10" y="34" width="250" height="96" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/><text x="24" y="56" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="400">...prior sentence of context...</text><rect x="22" y="66" width="226" height="24" fill="#dce6ef" rx="3"/><text x="30" y="83" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">the highlighted evidence span</text><text x="24" y="110" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="400">...following sentence of context...</text><text x="135" y="150" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">read in context</text><text x="135" y="172" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">verdict: "Claim"</text><rect x="300" y="58" width="250" height="48" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/><rect x="312" y="70" width="226" height="24" fill="#dce6ef" rx="3"/><text x="320" y="87" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">the highlighted evidence span</text><text x="425" y="150" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">read alone</text><text x="425" y="172" font-size="13" fill="#2E4A62" text-anchor="middle" font-weight="600">verdict: "Position"</text><line x1="268" y1="82" x2="292" y2="82" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><text x="280" y="105" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">remove</text><text x="280" y="117" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">context</text><text x="10" y="204" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Sufficiency is not a property of the evidence alone. It depends on who is reading it,</text><text x="10" y="222" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">which is what the standard metrics quietly assume away.</text>
</svg>